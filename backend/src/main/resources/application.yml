server:
  port: 8080

spring:
  application:
    name: campus-lostfound
  datasource:
    url: jdbc:sqlite:./data/campus_lostfound.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: campus-lostfound-jwt-secret-key-2024-very-long-string
    expiration-ms: 86400000
  upload-dir: uploads
